<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block 3">
<title>Jeff's Workout Tracker - Block 3</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--line:#2a3240;
  --text:#e6edf3;--dim:#8b949e;--accent:#3fb950;--accent2:#4a9eff;
  --warn:#d29922;--bad:#f85149;--radius:10px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{height:100%;background:var(--bg)}
body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:16px;
  line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
h2,h3{font-weight:600}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}

/* HEADER */
.app-header{flex-shrink:0;z-index:20;
  background:rgba(13,17,23,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.app-title{font-size:17px;font-weight:600;letter-spacing:-.01em}
.block-chip{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  color:var(--accent);background:rgba(63,185,80,.12);padding:3px 10px;border-radius:20px}
.week-nav{display:flex;align-items:center;gap:6px;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:4px 6px;margin-top:10px}
.week-nav button{padding:2px 10px;color:var(--dim);font-size:18px;line-height:1}
.week-nav button:disabled{opacity:.3}
.week-nav .wlbl{font-size:13px;flex:1;text-align:center;font-variant-numeric:tabular-nums}
.week-dots{display:flex;gap:4px;flex:1;align-items:center}
.wdot{flex:1;height:4px;border-radius:2px;background:var(--line);cursor:pointer}
.wdot.done{background:var(--accent);opacity:.5}
.wdot.active{background:var(--accent)}
.wdot.deload{background:var(--dim)}
.focus-banner{font-size:12px;color:var(--accent);margin-top:8px;line-height:1.4;
  background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2);
  border-radius:8px;padding:8px 12px}
.focus-banner.deload{color:var(--dim);background:rgba(139,148,158,.08);
  border-color:rgba(139,148,158,.2)}
.focus-rpe{font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  font-weight:600;opacity:.7;display:block;margin-bottom:2px}

/* MAIN */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 16px 24px;max-width:640px;margin:0 auto;width:100%}
.panel{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;margin-bottom:12px}
.muted{color:var(--dim);font-size:13px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.row{display:flex;gap:8px}.row>*{flex:1}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* DAY SELECTOR (train view) */
.day-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding-bottom:2px;margin-bottom:14px}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:13px;
  font-weight:500;border:1px solid var(--line);background:var(--panel2);
  color:var(--dim);cursor:pointer;white-space:nowrap}
.day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* EXERCISE CARDS */
.ex{border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:8px;overflow:hidden;background:var(--panel)}
.ex.logged{border-left:3px solid var(--accent)}
.exh{display:flex;justify-content:space-between;align-items:center;
  gap:10px;padding:13px 14px;width:100%;text-align:left}
.exh-left{flex:1}
.exh-left b{font-size:15px;font-weight:600;display:block}
.exh-left .sub{font-size:12px;color:var(--dim);margin-top:2px}
.exh-left .ex-link{font-size:11px;color:var(--accent2);text-decoration:none;opacity:.8}
.exh-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sets-done{font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.chev{color:var(--dim);font-size:12px}
.exb{padding:0 14px 14px;border-top:1px solid var(--line)}

/* SET ROWS */
.set-lbls{display:grid;grid-template-columns:24px 1fr 1fr 1fr 42px;
  gap:5px;font-size:11px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.04em;text-align:center;margin-top:10px;margin-bottom:4px}
.setr{display:grid;grid-template-columns:24px 1fr 1fr 1fr 42px;
  gap:5px;align-items:center;margin-bottom:4px}
.setr .sn{font-size:13px;color:var(--dim);text-align:center;
  font-variant-numeric:tabular-nums}
.setr input{padding:10px 4px;text-align:center;font-size:14px;
  font-variant-numeric:tabular-nums}
.setr .tick{background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:10px 0;text-align:center;color:var(--dim);font-size:15px}
.setr.ok .tick{background:rgba(63,185,80,.18);border-color:var(--accent);color:var(--accent)}
.setr.ok input{border-color:rgba(63,185,80,.3)}
.prev-hint{font-size:11px;color:var(--dim);text-align:right;margin-top:2px}

/* NOTES in exercise */
.ex-notes-row{display:flex;align-items:flex-start;gap:8px;margin-top:8px;
  padding-top:8px;border-top:1px solid var(--line)}
.ex-notes-lbl{font-size:11px;color:var(--dim);padding-top:9px;white-space:nowrap}
.ex-notes-input{flex:1;min-height:34px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;font-size:13px;color:var(--text);padding:8px 10px;resize:none;
  font-family:inherit;line-height:1.4}
.ex-notes-input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.ex-notes-input::placeholder{color:var(--dim)}

/* CARDIO BLOCK */
.cardio-block{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px;margin-bottom:8px;
  border-left:3px solid var(--accent2)}
.cardio-type{font-size:14px;font-weight:600;color:var(--accent2)}
.cardio-detail{font-size:13px;color:var(--dim);margin-top:3px}

/* REST CARD */
.rest-card{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:32px 20px;text-align:center;margin-bottom:8px}
.rest-icon{font-size:32px;margin-bottom:10px}
.rest-title{font-size:16px;font-weight:600;margin-bottom:8px}
.rest-sub{font-size:13px;color:var(--dim);line-height:1.6}

/* PROGRESS VIEW */
.prog-section{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.prog-section-hdr{padding:10px 14px;background:var(--panel2);
  border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--dim)}
.prog-section-body{padding:0 8px 8px}
.prog-table{width:100%;border-collapse:collapse;font-size:12px}
.prog-table th{text-align:left;color:var(--dim);font-weight:500;padding:7px 5px 4px;
  font-size:10px;letter-spacing:.3px;text-transform:uppercase}
.prog-table th.num{text-align:center}
.prog-table td{padding:6px 5px;border-top:1px solid var(--line);color:var(--dim);vertical-align:middle}
.prog-table td.ex-col{color:var(--text);font-weight:500;font-size:11px;line-height:1.3}
.prog-table td.wt-col{text-align:center;font-size:12px;font-weight:600;color:var(--text)}
.prog-table td.wt-col.empty{color:var(--dim);font-weight:400;font-size:11px}
.prog-table td.wt-col.best{color:var(--accent);font-weight:700}
.prog-cell .pw{font-size:12px;font-weight:600;display:block}
.prog-cell .pm{font-size:10px;color:var(--dim);display:block}
.prog-table tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.note-row td{border-top:none !important;padding:2px 5px 8px !important;
  font-size:10px;color:var(--dim);font-style:italic;line-height:1.5}
.no-data{font-size:13px;color:var(--dim);text-align:center;
  padding:24px;font-style:italic}

/* DAILY VIEW */
.spark{width:100%;height:48px;display:block;margin-top:8px}
table.data-table{width:100%;border-collapse:collapse;font-size:13px}
table.data-table th{text-align:left;color:var(--dim);font-weight:500;
  padding:7px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
  border-bottom:1px solid var(--line)}
table.data-table td{padding:7px 6px;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;color:var(--text)}

/* BUTTONS */
.btn{display:block;width:100%;background:var(--accent);color:#fff;
  border-radius:var(--radius);padding:13px;font-weight:600;text-align:center;font-size:15px}
.btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.btn.blue{background:var(--accent2)}
.btn:active{opacity:.75}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{flex:1}

/* TIMER */
.timer{position:fixed;left:16px;right:16px;
  bottom:calc(116px + var(--safe-bottom) + 8px);
  background:var(--accent2);color:#fff;border-radius:var(--radius);
  padding:12px 16px;display:none;justify-content:space-between;
  align-items:center;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.5);
  max-width:608px;margin:0 auto}
.timer.on{display:flex}
.timer b{font-size:20px;font-variant-numeric:tabular-nums}
.timer .skip{font-size:13px;opacity:.85}

/* NAV */
nav{flex-shrink:0;background:rgba(13,17,23,.96);
  border-bottom:1px solid var(--line);display:flex;}
nav button{flex:1;padding:8px 4px;color:var(--dim);font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--accent)}
nav .ic{font-size:19px;line-height:1}

/* BOTTOM BAR */
.bottom-bar{flex-shrink:0;background:rgba(13,17,23,.96);
  border-top:1px solid var(--line);
  padding:10px 16px;
  display:flex;align-items:center;gap:8px;width:100%}
.save-btn{flex:1;height:44px;background:var(--accent);color:#fff;border:none;
  border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px}
.save-btn.saved{background:#2d8f3e}
.sync-btn{height:44px;padding:0 14px;background:rgba(74,158,255,.12);
  color:var(--accent2);border:1px solid rgba(74,158,255,.25);
  border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.reset-btn{height:44px;padding:0 12px;background:none;color:var(--dim);
  border:1px solid var(--line);border-radius:var(--radius);font-size:11px;
  font-weight:500;cursor:pointer;white-space:nowrap}
.prog-count{flex-shrink:0;text-align:center;min-width:40px}
.prog-num{font-size:17px;font-weight:700;color:var(--accent);display:block;line-height:1.1}
.prog-lbl{font-size:10px;color:var(--dim)}
.hide{display:none}
</style>
</head>
<body>

<div class="app-header">
  <div class="hrow">
    <span class="app-title">Workout Tracker</span>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="progToggle" style="font-size:12px;font-weight:500;color:var(--accent2);
        background:rgba(74,158,255,.12);padding:4px 10px;border-radius:20px;
        border:none;cursor:pointer" onclick="toggleProgress()">Progress</button>
      <span class="block-chip">Block 3</span>
    </div>
  </div>
  <div class="week-nav" id="weekNavWrap">
    <button id="prevBtn" onclick="changeWeek(-1)" disabled>&#8249;</button>
    <div class="week-dots" id="weekDots"></div>
    <span class="wlbl" id="weekLabel">Week 1</span>
    <button id="nextBtn" onclick="changeWeek(1)">&#8250;</button>
  </div>
  <div id="focusBanner" class="focus-banner"></div>
</div>

<nav id="mainNav">
  <button class="on" data-v="train" onclick="goView('train')">
    <span class="ic">&#127947;</span>Train
  </button>
  <button data-v="daily" onclick="goView('daily')">
    <span class="ic">&#128200;</span>Daily
  </button>
</nav>

<main>
  <section id="v-train"></section>
  <section id="v-progress" class="hide"></section>
  <section id="v-daily" class="hide"></section>
</main>

<div class="timer" id="timer">
  <span id="tmrLabel">Rest</span>
  <b id="tmrVal">0:00</b>
  <button class="skip" onclick="stopTimer()">Skip ›</button>
</div>

<div class="bottom-bar" id="bottomBar">
  <div class="prog-count" id="progCount">
    <span class="prog-num" id="progNum">-</span>
    <span class="prog-lbl">logged</span>
  </div>
  <button class="save-btn" id="saveBtn" onclick="saveAll()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
    </svg>Save
  </button>
  <button class="sync-btn" id="syncBtn" onclick="doSync()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>Sync
  </button>
  <button class="reset-btn" onclick="clearSyncCache()">Reset sync</button>
</div>


<script>
/* ============================================================
   CONSTANTS & PROGRAM
   ============================================================ */
var APP_VERSION = '3.0';
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxgO7SWJ79mL2kgWZr7likbu-Ux3fQ5aQdz9FH5hbwJgSiw7C0kEhgSDMeU7rk9xXEEEw/exec';

var WEEKS = [
  { label:"Wk 1", full:"Week 1", isDeload:false, setsAdj:0, rpeLabel:"RPE 7-8",
    focus:"Foundation week - establish your baseline weights. RPE 7-8, leave 2 reps in reserve." },
  { label:"Wk 2", full:"Week 2", isDeload:false, setsAdj:0, rpeLabel:"RPE 8-8.5",
    focus:"Add weight where Week 1 felt easy. If you hit the top of the rep range comfortably, add 5 lbs." },
  { label:"Wk 3", full:"Week 3", isDeload:false, setsAdj:1, rpeLabel:"RPE 8.5-9",
    focus:"Overload week - push top set to RPE 9 on main lifts. Volume at its peak. This is the hard week." },
  { label:"Wk 4", full:"Week 4 - Deload", isDeload:true, setsAdj:-1, rpeLabel:"RPE 7 cap",
    focus:"Deload week - reduce sets by 1, keep same weights. Recover and absorb. Assess what to carry into Block 4." }
];

var DAYS = [
  { id:"pushA", label:"Push A", muscle:"Chest - Shoulders - Triceps", cardio:null,
    exercises:[
      { name:"Barbell Bench Press", sets:"3-4", reps:"4-6", startWeight:"225", rest:180, url:"barbell-bench-press",
        desc:"Lie flat, grip slightly wider than shoulders. Lower to lower-mid chest, elbows at 45 degrees. Press to lockout.",
        note:"Top set - primary progression marker. Add 5 lbs if you hit 6 reps at RPE 8.5 or below." },
      { name:"Seated DB Overhead Press", sets:"3", reps:"8-10", startWeight:"50", rest:120, url:"dumbbell-shoulder-press",
        desc:"Sit upright, back supported. Press DBs from shoulder height to lockout overhead. Control the descent.",
        note:"New this block. Start conservative at 50s - shoulder pressing is different from chest." },
      { name:"Incline DB Press", sets:"3", reps:"6-10", startWeight:"75", rest:90, url:"incline-dumbbell-bench-press",

      { name:"DB Incline Fly", sets:"3", reps:"12-15", startWeight:"25", rest:75, url:"incline-dumbbell-flyes",

  { id:"pullA", label:"Pull A", muscle:"Back - Biceps",

    exercises:[
      { name:"Pendlay Row", sets:"3-4", reps:"5-8", startWeight:"165", rest:150, url:"pendlay-row", noHtml:true,

  { id:"legsA", label:"Legs A", muscle:"Quads - Hamstrings - Calves - Core", cardio:null,

      { name:"Hack Squat", sets:"3", reps:"6-8", startWeight:"205", rest:120, url:"hack-squat",

        note:"Returns from Block 1. Start at 205 and rebuild." },
      { name:"Standing Calf Raise", sets:"4", reps:"12-15", startWeight:"388", rest:60, url:"standing-machine-calf-raise", noHtml:true,

      { name:"Hanging Leg Raise", sets:"3", reps:"8-12", startWeight:"BW", rest:60, url:"hanging-leg-raise",

  { id:"pushB", label:"Push B", muscle:"Chest - Shoulders - Triceps",
    cardio:{ type:"Outdoor Bike Ride", duration:"60-75 min", effort:"RPE 6-7",

    exercises:[
      { name:"Decline Barbell Press", sets:"3", reps:"8-10", startWeight:"155", rest:120, url:"decline-barbell-bench-press",

      { name:"Flat DB Press - Neutral Grip", sets:"3", reps:"8-10", startWeight:"80", rest:90, url:"dumbbell-bench-press",

var RPE_OPTIONS = ['--','6','6.5','7','7.5','8','8.5','9','9.5','10'];

/* ============================================================
   STATE
   ============================================================ */
var currentWeek = 0;
var currentDay = 0;
var currentView = 'train';
var showingProgress = false;
var weights = {}, reps = {}, rpeVals = {}, notes = {}, synced = {};

var tmr = null, tmrLeft = 0;
var openExIdx = 0;

/* ============================================================
   STORAGE
   ============================================================ */
function loadData() {
  try { var w = localStorage.getItem('jeff_workout_b3'); if (w) weights = JSON.parse(w); } catch(e) { weights = {}; }
  try { var r = localStorage.getItem('jeff_reps_b3'); if (r) reps = JSON.parse(r); } catch(e) { reps = {}; }
  try { var p = localStorage.getItem('jeff_rpe_b3'); if (p) rpeVals = JSON.parse(p); } catch(e) { rpeVals = {}; }
  try { var n = localStorage.getItem('jeff_notes_b3'); if (n) notes = JSON.parse(n); } catch(e) { notes = {}; }
  try { var s = localStorage.getItem('jeff_synced_b3'); if (s) synced = JSON.parse(s); } catch(e) { synced = {}; }
  try { var d = localStorage.getItem('jeff_daily_b3'); if (d) daily = JSON.parse(d); } catch(e) { daily = {}; }
  try { var wk = localStorage.getItem('jeff_week_b3'); if (wk !== null) currentWeek = parseInt(wk); } catch(e) {}
  try { var dy = localStorage.getItem('jeff_day_b3'); if (dy !== null) currentDay = parseInt(dy); } catch(e) {}
}

function saveAll() {
  try {
    localStorage.setItem('jeff_workout_b3', JSON.stringify(weights));
    localStorage.setItem('jeff_reps_b3', JSON.stringify(reps));
    localStorage.setItem('jeff_rpe_b3', JSON.stringify(rpeVals));
    localStorage.setItem('jeff_notes_b3', JSON.stringify(notes));
    localStorage.setItem('jeff_synced_b3', JSON.stringify(synced));
    localStorage.setItem('jeff_daily_b3', JSON.stringify(daily));
    localStorage.setItem('jeff_week_b3', String(currentWeek));
    localStorage.setItem('jeff_day_b3', String(currentDay));
    var btn = document.getElementById('saveBtn');
    btn.classList.add('saved');
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Saved';
    showToast('Saved');
    setTimeout(function() {
      btn.classList.remove('saved');
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Save';
    }, 2000);
  } catch(e) { showToast('Could not save'); }
}

function saveDailyEntry() {
  var wEl = document.getElementById('daily-weight');
  var sEl = document.getElementById('daily-steps');
  var d = today();
  if (!daily[d]) daily[d] = {};
  if (wEl && wEl.value !== '') daily[d].weight = parseFloat(wEl.value);
  else if (wEl) delete daily[d].weight;
  if (sEl && sEl.value !== '') daily[d].steps = parseInt(sEl.value);
  else if (sEl) delete daily[d].steps;
  if (!daily[d].weight && !daily[d].steps) delete daily[d];
  try { localStorage.setItem('jeff_daily_b3', JSON.stringify(daily)); } catch(e) {}
  showToast('Daily entry saved');
  renderView();
}

/* ============================================================
   KEYS
   ============================================================ */
function wkey(w, d, e) { return 'jw_' + w + '_' + d + '_' + e.replace(/[^a-zA-Z0-9]/g,'_'); }
function rkey(w, d, e) { return 'jr_' + w + '_' + d + '_' + e.replace(/[^a-zA-Z0-9]/g,'_'); }
function pkey(w, d, e) { return 'jp_' + w + '_' + d + '_' + e.replace(/[^a-zA-Z0-9]/g,'_'); }
function nkey(w, d, e) { return 'jn_' + w + '_' + d + '_' + e.replace(/[^a-zA-Z0-9]/g,'_'); }
function today() { var d = new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n) { return String(n).padStart(2,'0'); }

/* ============================================================
   WEEK / DAY NAV
   ============================================================ */
function changeWeek(dir) {
  var n = currentWeek + dir;
  if (n < 0 || n >= WEEKS.length) return;
  currentWeek = n;
  try { localStorage.setItem('jeff_week_b3', String(currentWeek)); } catch(e) {}
  renderHeader();
  renderView();
}

function selectDay(i) {
  currentDay = i;
  openExIdx = 0;
  try { localStorage.setItem('jeff_day_b3', String(currentDay)); } catch(e) {}
  renderView();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function adjSets(sets, adj) {
  if (!sets) return sets;
  var sfx = '';
  var base = sets;
  if (sets.indexOf('each leg') !== -1) { sfx = ' each leg'; base = sets.replace(' each leg',''); }
  else if (sets.indexOf('each') !== -1) { sfx = ' each'; base = sets.replace(' each',''); }
  var p = base.split('-');
  if (p.length === 2) return Math.max(2,parseInt(p[0])+adj)+'-'+Math.max(2,parseInt(p[1])+adj)+sfx;
  return Math.max(2,parseInt(base)+adj)+sfx;
}

/* ============================================================
   TIMER
   ============================================================ */
function startTimer(sec) {
  stopTimer();
  tmrLeft = sec;
  document.getElementById('timer').classList.add('on');
  paintTimer();
  tmr = setInterval(function() {
    tmrLeft--;
    paintTimer();
    if (tmrLeft <= 0) {
      if (navigator.vibrate) navigator.vibrate([200,100,200]);
      stopTimer();
    }
  }, 1000);
}
function paintTimer() {
  document.getElementById('tmrVal').textContent =
    Math.floor(tmrLeft/60) + ':' + p2(Math.max(0,tmrLeft%60));
}
function stopTimer() {
  if (tmr) clearInterval(tmr);
  tmr = null;
  document.getElementById('timer').classList.remove('on');
}

/* ============================================================
   SET TICK
   ============================================================ */
function tickSet(dayId, exName, setIdx, restSec, defaultWeight) {
  var wk = wkey(currentWeek, dayId, exName);
  var rk = rkey(currentWeek, dayId, exName);
  var safeName = exName.replace(/[^a-zA-Z0-9]/g,'_');
  var wEl = document.getElementById('w_'+dayId+'_'+setIdx+'_'+safeName);
  var rEl = document.getElementById('r_'+dayId+'_'+setIdx+'_'+safeName);
  var pEl = document.getElementById('p_'+dayId+'_'+setIdx+'_'+safeName);

  // Read raw strings to know if user actually typed something
  var wRaw = wEl ? wEl.value.trim() : '';
  var rRaw = rEl ? rEl.value.trim() : '';
  var curP = pEl ? pEl.value : '--';

  // Weight: use typed value, fall back to startWeight only if empty
  var curW = wRaw !== '' ? parseFloat(wRaw) : (defaultWeight && defaultWeight !== 'BW' ? parseFloat(defaultWeight) : 0);

  // Reps: use ONLY what the user typed - never override with a hardcoded fallback
  var curR = rRaw !== '' ? parseInt(rRaw) : 0;

  // Write resolved weight back into field so it is visible, but never touch the reps field
  if (wEl && curW) wEl.value = curW;

  var setKey = wk + '_s' + setIdx;
  // Untick if already done
  if (weights[setKey + '_done']) {
    delete weights[setKey + '_done'];
    var card = document.getElementById('setrow_'+dayId+'_'+setIdx+'_'+safeName);
    if (card) card.classList.remove('ok');
    updateProgress();
    return;
  }

  // Mark done and store values
  weights[setKey + '_done'] = true;
  if (curW) weights[wk] = String(curW);
  if (curR) reps[rk] = String(curR);
  if (curP && curP !== '--') rpeVals[pkey(currentWeek, dayId, exName)] = curP;

  var card = document.getElementById('setrow_'+dayId+'_'+setIdx+'_'+safeName);
  if (card) card.classList.add('ok');
  startTimer(restSec);
  updateProgress();
}

/* ============================================================
   RENDER HEADER
   ============================================================ */
function renderHeader() {
  var wk = WEEKS[currentWeek];
  document.getElementById('prevBtn').disabled = (currentWeek === 0);
  document.getElementById('nextBtn').disabled = (currentWeek === WEEKS.length - 1);
  document.getElementById('weekLabel').textContent = wk.label;
  var dots = '';
  for (var i = 0; i < WEEKS.length; i++) {
    var cls = 'wdot' + (i < currentWeek ? ' done' : i === currentWeek ? ' active' : '') + (WEEKS[i].isDeload ? ' deload' : '');
    var diff = i - currentWeek;
    dots += '<div class="'+cls+'" onclick="changeWeek('+diff+')"></div>';
  }
  document.getElementById('weekDots').innerHTML = dots;
  var banner = document.getElementById('focusBanner');
  banner.className = 'focus-banner' + (wk.isDeload ? ' deload' : '');
  banner.innerHTML = '<span class="focus-rpe">'+wk.rpeLabel+'</span>'+wk.focus;
}

/* ============================================================
   RENDER TRAIN VIEW
   ============================================================ */
function renderTrain() {
  var day = DAYS[currentDay];
  var wk = WEEKS[currentWeek];
  var h = '';

  // Day tabs
  h += '<div class="day-tabs">';
  for (var i = 0; i < DAYS.length; i++) {
    h += '<div class="day-tab'+(i===currentDay?' active':'')+'" onclick="selectDay('+i+')">'+DAYS[i].label+'</div>';
  }
  h += '</div>';

  h += '<div style="font-size:13px;color:var(--dim);margin-bottom:12px">'+day.label+' &mdash; '+day.muscle+'</div>';

  if (day.isRest) {
    h += '<div class="rest-card"><div class="rest-icon">&#127807;</div>';
    h += '<div class="rest-title">Rest &amp; Recovery</div>';
    h += '<div class="rest-sub">'+day.restNote+'</div></div>';
    return h;
  }

  if (day.cardio) {
    h += '<div class="cardio-block">';
    h += '<div style="display:flex;align-items:center;justify-content:space-between">';
    h += '<span class="cardio-type">'+day.cardio.type+'</span>';
    h += '<span style="font-size:11px;color:var(--accent2);background:rgba(74,158,255,.12);padding:2px 8px;border-radius:10px">'+day.cardio.effort+'</span>';
    h += '</div>';
    h += '<div class="cardio-detail">'+day.cardio.duration+' &mdash; <em>'+day.cardio.note+'</em></div>';
    h += '</div>';
  }

  for (var e = 0; e < day.exercises.length; e++) {
    var ex = day.exercises[e];
    var wk_key = wkey(currentWeek, day.id, ex.name);
    var n_key = nkey(currentWeek, day.id, ex.name);
    var pwk = currentWeek > 0 ? wkey(currentWeek-1, day.id, ex.name) : null;
    var prk = currentWeek > 0 ? rkey(currentWeek-1, day.id, ex.name) : null;
    var ppk = currentWeek > 0 ? pkey(currentWeek-1, day.id, ex.name) : null;
    var cv = weights[wk_key] || '';
    var crv = reps[rkey(currentWeek, day.id, ex.name)] || '';
    var cpv = rpeVals[pkey(currentWeek, day.id, ex.name)] || '--';
    var cn = notes[n_key] || '';
    var pv = pwk ? (weights[pwk] || '') : '';
    var prv = prk ? (reps[prk] || '') : '';
    var ppv = ppk ? (rpeVals[ppk] || '') : '';
    var sd = adjSets(ex.sets, wk.setsAdj);
    var isLogged = !!cv;
    var isOpen = openExIdx === e;
    var exUrl = ex.noHtml
      ? 'https://www.muscleandstrength.com/exercises/'+ex.url
      : 'https://www.muscleandstrength.com/exercises/'+ex.url+'.html';

    // Count done sets
    var doneSets = 0;
    var setsNum = parseInt(sd.split('-')[0]) || 3;
    for (var s = 0; s < setsNum + 2; s++) {
      if (weights[wk_key + '_s' + s + '_done']) doneSets++;
    }

    h += '<div class="ex'+(isLogged?' logged':'')+'">';
    h += '<button class="exh" onclick="toggleEx('+e+')" style="width:100%">';
    h += '<div class="exh-left">';
    h += '<b>'+ex.name+'</b>';
    h += '<div class="sub">'+sd+' x '+ex.reps+' &nbsp;&middot;&nbsp; RPE target '+wk.rpeLabel.split('-')[0]+'-'+wk.rpeLabel.split('-')[1]+'</div>';
    h += '<a class="ex-link" href="'+exUrl+'" target="_blank" onclick="event.stopPropagation()">&#128279; muscleandstrength.com</a>';
    h += '</div>';
    h += '<div class="exh-right">';
    if (doneSets > 0) h += '<span class="sets-done">'+doneSets+'/'+setsNum+'</span>';
    h += '<span class="chev">'+(isOpen?'&#9660;':'&#9658;')+'</span>';
    h += '</div></button>';

    if (isOpen) {
      h += '<div class="exb">';
      h += '<div style="font-size:12px;color:var(--dim);line-height:1.5;padding:10px 0 8px">'+ex.desc+'</div>';
      if (ex.note) h += '<div style="font-size:11px;color:var(--warn);background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.2);border-radius:6px;padding:6px 10px;margin-bottom:10px;line-height:1.4">'+ex.note+'</div>';
      if (pv) h += '<div class="prev-hint">Last week: '+pv+' lbs'+(prv?' &middot; '+prv+' reps':'')+(ppv && ppv!=='--'?' &middot; RPE '+ppv:'')+'</div>';

      // Set rows
      h += '<div class="set-lbls"><div></div><div>lbs</div><div>reps</div><div>RPE</div><div></div></div>';
      var totalSets = parseInt(sd.split('-')[0]) || 3;
      var safeName = ex.name.replace(/[^a-zA-Z0-9]/g,'_');
      for (var s2 = 0; s2 < totalSets; s2++) {
        var isDone = !!weights[wk_key + '_s' + s2 + '_done'];
        var prevW = pv || ex.startWeight || '';
        var prevR = prv || '';
        h += '<div class="setr'+(isDone?' ok':'')+'" id="setrow_'+day.id+'_'+s2+'_'+safeName+'">';
        h += '<div class="sn">'+(s2+1)+'</div>';
        h += '<input type="number" inputmode="decimal" id="w_'+day.id+'_'+s2+'_'+safeName+'" placeholder="'+(prevW||'--')+'" value="'+(isDone&&cv?cv:'')+'" min="0" step="2.5">';
        h += '<input type="number" inputmode="numeric" id="r_'+day.id+'_'+s2+'_'+safeName+'" placeholder="'+(prevR||ex.reps)+'" value="'+(isDone&&crv?crv:'')+'" min="0" step="1">';
        var rpeOpts = '';
        for (var o = 0; o < RPE_OPTIONS.length; o++) {
          var opt = RPE_OPTIONS[o];
          rpeOpts += '<option value="'+opt+'"'+(cpv===opt?' selected':'')+'>'+(opt==='--'?'RPE':opt)+'</option>';
        }
        h += '<select id="p_'+day.id+'_'+s2+'_'+safeName+'">'+rpeOpts+'</select>';
        h += '<button class="tick" onclick="tickSet(\''+day.id+'\',\''+esc(ex.name)+'\','+s2+','+ex.rest+',\''+ex.startWeight+'\')">&#10003;</button>';
        h += '</div>';
      }

      // Notes
      h += '<div class="ex-notes-row">';
      h += '<span class="ex-notes-lbl">Notes</span>';
      h += '<textarea class="ex-notes-input" rows="1" placeholder="Optional notes..." onchange="updateNote(\''+nkey(currentWeek,day.id,ex.name)+'\',this.value)" oninput="autoResize(this);updateNote(\''+nkey(currentWeek,day.id,ex.name)+'\',this.value)">'+cn+'</textarea>';
      h += '</div>';
      h += '</div>';
    }
    h += '</div>';
  }

  return h;
}

function toggleEx(i) {
  openExIdx = openExIdx === i ? -1 : i;
  renderView();
  if (openExIdx === i) {
    setTimeout(function() {
      var cards = document.querySelectorAll('.ex');
      if (cards[i]) {
        cards[i].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }, 50);
  }
}

function esc(s) { return s.replace(/'/g,"\\'"); }

function updateNote(key, val) {
  var v = (val||'').trim();
  if (v) notes[key] = v; else delete notes[key];
}

function autoResize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

function updateWeight(key, val) {
  var v = (val||'').toString().trim();
  if (v && !isNaN(parseFloat(v))) weights[key] = v; else delete weights[key];
  updateProgress();
}

function updateProgress() {
  var day = DAYS[currentDay];
  if (day.isRest || !day.exercises.length) {
    document.getElementById('progNum').textContent = '-';
    return;
  }
  var n = 0;
  for (var e = 0; e < day.exercises.length; e++) {
    if (weights[wkey(currentWeek, day.id, day.exercises[e].name)]) n++;
  }
  document.getElementById('progNum').textContent = n + '/' + day.exercises.length;
}

/* ============================================================
   RENDER PROGRESS VIEW
   ============================================================ */
function renderProgress() {
  var h = '<div style="font-family:Georgia,serif;font-size:20px;font-weight:normal;color:var(--text);letter-spacing:-.3px;margin-bottom:4px">Progress</div>';
  h += '<div style="font-size:13px;color:var(--dim);margin-bottom:14px">Block 3 &mdash; all exercises across all weeks</div>';
  var hasData = false;
  for (var d = 0; d < DAYS.length; d++) {
    var day = DAYS[d];
    if (day.isRest || !day.exercises.length) continue;
    h += '<div class="prog-section"><div class="prog-section-hdr">'+day.label+' &mdash; '+day.muscle+'</div>';
    h += '<div class="prog-section-body"><table class="prog-table">';
    h += '<tr><th>Exercise</th><th class="num">Wk 1</th><th class="num">Wk 2</th><th class="num">Wk 3</th><th class="num">Wk 4</th></tr>';
    for (var e = 0; e < day.exercises.length; e++) {
      var ex = day.exercises[e];
      var vals = [];
      var maxV = 0;
      for (var w = 0; w < WEEKS.length; w++) {
        var v = weights[wkey(w, day.id, ex.name)] || '';
        var rv = reps[rkey(w, day.id, ex.name)] || '';
        var pv = rpeVals[pkey(w, day.id, ex.name)] || '';
        vals.push({ wt:v, rp:rv, rpe:pv });
        if (v && parseFloat(v) > maxV) maxV = parseFloat(v);
        if (v) hasData = true;
      }
      h += '<tr><td class="ex-col">'+ex.name+'</td>';
      for (var w2 = 0; w2 < WEEKS.length; w2++) {
        var cell = vals[w2];
        var isBest = cell.wt && parseFloat(cell.wt) === maxV && maxV > 0;
        if (cell.wt) {
          h += '<td class="wt-col"><div class="prog-cell"><span class="pw'+(isBest?' best':'')+'" style="'+(isBest?'color:var(--accent)':'')+'">'+cell.wt+'</span>';
          var meta = [];
          if (cell.rp) meta.push(cell.rp+'r');
          if (cell.rpe && cell.rpe !== '--') meta.push('RPE '+cell.rpe);
          if (meta.length) h += '<span class="pm">'+meta.join(' / ')+'</span>';
          h += '</div></td>';
        } else {
          h += '<td class="wt-col empty">-</td>';
        }
      }
      h += '</tr>';
      var noteTexts = [];
      for (var w3 = 0; w3 < WEEKS.length; w3++) {
        var nv = notes[nkey(w3, day.id, ex.name)];
        if (nv) noteTexts.push('W'+(w3+1)+': '+nv);
      }
      if (noteTexts.length) h += '<tr class="note-row"><td colspan="5">'+noteTexts.join(' &bull; ')+'</td></tr>';
    }
    h += '</table></div></div>';
  }
  if (!hasData) h += '<div class="no-data">No weights logged yet. Start tracking and progress will appear here.</div>';
  return h;
}

/* ============================================================
   RENDER DAILY VIEW
   ============================================================ */
function renderDaily() {
  var d = today();
  var rec = daily[d] || {};
  var allDays = Object.keys(daily).sort().reverse();
  var weightDays = allDays.filter(function(k) { return daily[k].weight; });

  // 7-day average
  var avg7 = null;
  if (weightDays.length >= 3) {
    var last7 = weightDays.slice(0,7);
    var sum = last7.reduce(function(a,k) { return a + daily[k].weight; }, 0);
    avg7 = sum / last7.length;
  }

  // Sparkline
  var sparkSvg = '';
  if (weightDays.length >= 2) {
    var wVals = weightDays.slice().reverse().map(function(k) { return daily[k].weight; });
    var W = 300, H = 48, mn = Math.min.apply(null,wVals), mx = Math.max.apply(null,wVals), rg = (mx-mn)||1;
    var pts = wVals.map(function(y,i) {
      return [(i/(wVals.length-1))*W, H-4-((y-mn)/rg)*(H-8)];
    });
    sparkSvg = '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
    sparkSvg += '<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="';
    sparkSvg += pts.map(function(p) { return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
    sparkSvg += '"/></svg>';
  }

  var h = '';

  // Today entry
  h += '<div class="panel">';
  h += '<h3 class="mb12">Today &mdash; '+d+'</h3>';
  h += '<div class="row mb12">';
  h += '<div class="field" style="margin:0"><label>Morning Weight (lbs)</label>';
  h += '<input type="number" inputmode="decimal" step="0.1" id="daily-weight" value="'+(rec.weight||'')+'" placeholder="225.0"></div>';
  h += '<div class="field" style="margin:0"><label>Steps (end of day)</label>';
  h += '<input type="number" inputmode="numeric" id="daily-steps" value="'+(rec.steps||'')+'" placeholder="8000"></div>';
  h += '</div>';
  h += '<button class="btn" onclick="saveDailyEntry()">Save Today</button>';
  h += '</div>';

  // Weight trend
  h += '<div class="panel">';
  h += '<div class="muted mb8">7-day average weight</div>';
  if (avg7) {
    h += '<div class="big">'+avg7.toFixed(1)+' <span style="font-size:15px;color:var(--dim)">lbs</span></div>';
  } else {
    h += '<div class="big" style="color:var(--dim)">—</div>';
    h += '<div class="muted" style="margin-top:4px">Log at least 3 days to see your average.</div>';
  }
  if (sparkSvg) h += sparkSvg;
  h += '</div>';

  // Recent log table
  if (allDays.length > 0) {
    h += '<div class="panel">';
    h += '<h3 class="mb12">Recent Log</h3>';
    h += '<table class="data-table"><tr><th>Date</th><th>Weight</th><th>Steps</th></tr>';
    var show = allDays.slice(0, 14);
    show.forEach(function(k) {
      var r2 = daily[k];
      h += '<tr><td>'+k+'</td><td>'+(r2.weight ? r2.weight+' lbs' : '—')+'</td><td>'+(r2.steps ? r2.steps.toLocaleString() : '—')+'</td></tr>';
    });
    h += '</table>';
    h += '</div>';
  }

  return h;
}

/* ============================================================
   VIEW ROUTING
   ============================================================ */
function toggleProgress() {
  showingProgress = !showingProgress;
  document.getElementById('progToggle').style.background = showingProgress ? 'var(--accent2)' : 'rgba(74,158,255,.12)';
  document.getElementById('progToggle').style.color = showingProgress ? '#fff' : 'var(--accent2)';
  document.getElementById('progCount').style.display = showingProgress ? 'none' : 'block';
  renderView();
}

function goView(v) {
  currentView = v;
  showingProgress = false;
  document.getElementById('progToggle').style.background = 'rgba(74,158,255,.12)';
  document.getElementById('progToggle').style.color = 'var(--accent2)';
  document.getElementById('progCount').style.display = 'block';
  document.querySelectorAll('nav button').forEach(function(b) {
    b.classList.toggle('on', b.dataset.v === v);
  });
  var weekNavWrap = document.getElementById('weekNavWrap');
  var focusBanner = document.getElementById('focusBanner');
  weekNavWrap.style.display = v === 'daily' ? 'none' : 'flex';
  focusBanner.style.display = v === 'daily' ? 'none' : 'block';
  document.getElementById('bottomBar').style.display = v === 'daily' ? 'none' : 'flex';
  renderView();
}

function renderView() {
  var train = document.getElementById('v-train');
  var progress = document.getElementById('v-progress');
  var daily_el = document.getElementById('v-daily');

  if (currentView === 'daily') {
    train.className = 'hide';
    progress.className = 'hide';
    daily_el.className = '';
    daily_el.innerHTML = renderDaily();
    document.getElementById('ttl') && (document.getElementById('ttl').textContent = 'Daily');
    return;
  }

  daily_el.className = 'hide';

  if (showingProgress) {
    train.className = 'hide';
    progress.className = '';
    progress.innerHTML = renderProgress();
  } else {
    progress.className = 'hide';
    train.className = '';
    train.innerHTML = renderTrain();
    document.querySelectorAll('.notes-input, .ex-notes-input').forEach(function(el) { autoResize(el); });
    updateProgress();
  }
}

/* ============================================================
   SYNC
   ============================================================ */
function syncIcon() {
  return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>';
}

function doSync() {
  var btn = document.getElementById('syncBtn');
  btn.innerHTML = '... Syncing';

  var rows = [['Week','Day','Exercise','Sets x Reps','Weight (lbs)','Actual Reps','RPE','Notes']];
  var newSyncedKeys = [];

  for (var w = 0; w < WEEKS.length; w++) {
    for (var d = 0; d < DAYS.length; d++) {
      var day = DAYS[d];
      if (day.isRest || !day.exercises.length) continue;
      var dayHasData = false;
      for (var e = 0; e < day.exercises.length; e++) {
        var ex = day.exercises[e];
        if (weights[wkey(w,day.id,ex.name)] || reps[rkey(w,day.id,ex.name)] || notes[nkey(w,day.id,ex.name)]) {
          dayHasData = true; break;
        }
      }
      if (!dayHasData) continue;
      var dayHash = '';
      for (var e2 = 0; e2 < day.exercises.length; e2++) {
        var ex2 = day.exercises[e2];
        dayHash += (weights[wkey(w,day.id,ex2.name)]||'')+'|'+(reps[rkey(w,day.id,ex2.name)]||'')+'|'+(rpeVals[pkey(w,day.id,ex2.name)]||'')+'|'+(notes[nkey(w,day.id,ex2.name)]||'')+';';
      }
      var syncKey = 'w'+w+'_'+day.id;
      if (!synced[syncKey] || synced[syncKey] !== dayHash) {
        for (var e3 = 0; e3 < day.exercises.length; e3++) {
          var ex3 = day.exercises[e3];
          var wt = weights[wkey(w,day.id,ex3.name)] || '';
          var rv = reps[rkey(w,day.id,ex3.name)] || '';
          var pv = rpeVals[pkey(w,day.id,ex3.name)] || '';
          var nt = notes[nkey(w,day.id,ex3.name)] || '';
          if (wt || rv || nt) rows.push([WEEKS[w].full, day.label, ex3.name, ex3.sets+' x '+ex3.reps, wt, rv, pv, nt]);
        }
        newSyncedKeys.push({ key:syncKey, hash:dayHash });
      }
    }
  }

  // Also sync daily data
  var dailyRows = [['Date','Weight (lbs)','Steps']];
  Object.keys(daily).sort().forEach(function(k) {
    var r = daily[k];
    dailyRows.push([k, r.weight||'', r.steps||'']);
  });

  if (rows.length === 1 && dailyRows.length === 1) {
    showToast('Nothing to sync yet');
    btn.innerHTML = syncIcon() + ' Sync';
    return;
  }

  var payload = { rows: rows, append: true, sheetName: 'Workout Log - Block 3' };
  if (dailyRows.length > 1) payload.dailyRows = dailyRows;

  fetch(SCRIPT_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).then(function() {
    for (var i = 0; i < newSyncedKeys.length; i++) {
      synced[newSyncedKeys[i].key] = newSyncedKeys[i].hash;
    }
    localStorage.setItem('jeff_synced_b3', JSON.stringify(synced));
    showToast('Synced to Google Sheets');
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Synced';
    setTimeout(function() { btn.innerHTML = syncIcon() + ' Sync'; }, 3000);
  }).catch(function() {
    showToast('Sync failed - check connection');
    btn.innerHTML = syncIcon() + ' Sync';
  });
}

function clearSyncCache() {
  if (!confirm('Reset sync history? Your workout data is safe. Next sync will re-send all data to update the sheet.')) return;
  synced = {};
  localStorage.removeItem('jeff_synced_b3');
  showToast('Sync history cleared - tap Sync to re-sync all data');
}

/* ============================================================
   TOAST
   ============================================================ */
function showToast(msg) {
  var existing = document.getElementById('toast');
  if (existing) existing.remove();
  var t = document.createElement('div');
  t.id = 'toast';
  t.textContent = msg;
  t.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--text);color:var(--bg);font-size:13px;font-weight:500;padding:10px 18px;border-radius:20px;z-index:200;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap';
  document.body.appendChild(t);
  requestAnimationFrame(function() {
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
  });
  setTimeout(function() {
    t.style.opacity = '0';
    setTimeout(function() { t.remove(); }, 300);
  }, 2500);
}

/* ============================================================
   BOOT
   ============================================================ */
loadData();
renderHeader();
renderView();
</script>
